name: Plugin Build, Tests & AgentShield Gate

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  verify-and-security:
    name: Build Drift, Test Suite & AgentShield
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify Plugin Build Drift
        run: npm run build:check && npm run verify:plugins

      - name: Run Full Test Suite & Eval Harness
        run: npm test && npm run eval

      - name: Run AgentShield Local Gate
        run: node scripts/security-gate.mjs --min-grade=B

      - name: AgentShield Action Scanner
        uses: affaan-m/agentshield@v1
        continue-on-error: true
        with:
          path: "."
          min-severity: "medium"
          fail-on-findings: "true"
